<!DOCTYPE html>
<html>
<head>
  <title>Wardrob Contact Form Submission</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      color: #333;
      max-width: 600px;
      margin: 0 auto;
    }
    .header {
      background-color: #c5997b;
      color: white;
      padding: 20px;
      text-align: center;
    }
    .content {
      padding: 20px;
    }
    .field {
      margin-bottom: 15px;
    }
    .label {
      font-weight: bold;
      display: block;
      margin-bottom: 5px;
      color: #c5997b;
    }
    .footer {
      text-align: center;
      margin-top: 30px;
      font-size: 0.8em;
      color: #777;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>New Contact Form Submission</h1>
  </div>
  
  <div class="content">
    <p>You have received a new contact form submission from your website:</p>
    
    <div class="field">
      <span class="label">Name:</span>
      <span>{{from_name}}</span>
    </div>
    
    <div class="field">
      <span class="label">Email:</span>
      <span>{{from_email}}</span>
    </div>
    
    <div class="field">
      <span class="label">Phone:</span>
      <span>{{phone}}</span>
    </div>
    
    <div class="field">
      <span class="label">Address:</span>
      <span>{{address}}</span>
    </div>
    
    <div class="field">
      <span class="label">Service Requested:</span>
      <span>{{service}}</span>
    </div>
    
    <div class="field">
      <span class="label">Message:</span>
      <p>{{message}}</p>
    </div>
  </div>
  
  <div class="footer">
    <p>This email was sent from the contact form on your Wardrob website.</p>
  </div>
</body>
</html>
